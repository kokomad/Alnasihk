name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show files
        run: |
          ls -la
          echo "---- settings ----"
          cat settings.gradle.kts || echo "NO settings.gradle.kts"
          echo "---- app ----"
          ls -la app || echo "NO app folder"
          echo "---- app build file ----"
          cat app/build.gradle.kts | head -20 || echo "NO app/build.gradle.kts"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
